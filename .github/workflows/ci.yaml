name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  ktlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint && chmod a+x ktlint
      - run: curl -sSLo compose-rules https://github.com/mrmans0n/compose-rules/releases/download/v0.6.4/ktlint-compose-0.6.4-all.jar
      - run: ./ktlint --ruleset=compose-rules

  gradle:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
          - windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # https://github.com/gradle/actions/blob/50e97c2cd7a37755bbfafc9c5b7cafaece252f6e/docs/setup-gradle.md
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - run: ./gradlew build
      # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
      - name: Enable hardware acceleration
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android tests
        if: startsWith(matrix.os, 'ubuntu')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew --info connectedCheck

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
